name: CI

on:
  push:
    branches: ['main', 'hardening/**', 'arena/**']
  pull_request:
    branches: ['main']

# CI only needs to read the checked-out source. Do not grant write permissions
# to pull-request code, including code from forks.
permissions:
  contents: read

# Avoid spending runner time on stale commits after a newer commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qradmin
          POSTGRES_PASSWORD: qradmin_test
          POSTGRES_DB: qradmin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qradmin -d qradmin_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://qradmin:qradmin_test@localhost:5432/qradmin_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production sharp dependency
        run: node scripts/check-sharp-audit.cjs

      - name: Migration integration on clean PostgreSQL
        run: npm run db:migrate

      - name: Financial flow integration on clean PostgreSQL
        if: ${{ hashFiles('tests/postgres-financial-integration.test.cjs') != '' }}
        run: node --test tests/postgres-financial-integration.test.cjs

      - name: Waiter ownership integration on clean PostgreSQL
        if: ${{ hashFiles('tests/postgres-waiter-integration.test.cjs') != '' }}
        run: node --test tests/postgres-waiter-integration.test.cjs

      - name: QR/session lifecycle integration on clean PostgreSQL
        if: ${{ hashFiles('tests/postgres-qr-session.test.cjs') != '' }}
        run: node --test tests/postgres-qr-session.test.cjs

      - name: Financial concurrency integration on clean PostgreSQL
        if: ${{ hashFiles('tests/postgres-financial-concurrency.test.cjs') != '' }}
        run: node --test tests/postgres-financial-concurrency.test.cjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Vite content-hash can differ between local/CI runners (same src, different
      # chunk names). Require a successful build + intact dist shape instead of
      # byte-identical hashes.
      - name: dist/ integrity
        run: |
          test -f dist/index.html
          test "$(find dist/assets -name 'index-*.js' 2>/dev/null | wc -l)" -ge 1
          test "$(find dist/assets -name 'index-*.css' 2>/dev/null | wc -l)" -ge 1
          test "$(find dist/assets -name 'react-*.js' 2>/dev/null | wc -l)" -ge 1
          echo "dist/ ok after build (hash names may differ from committed tree)"

      - name: Regression tests
        run: npm run test:regression

      - name: Server and db syntax
        run: |
          node --check server.js
          for f in db/*.js scripts/*.js; do node --check "$f"; done

  # Disposable PostgreSQL: validates the complete migration chain from an empty
  # database and checks that rerunning the migration runner is idempotent.
  # No production secrets, Railway URL, seeds, or application traffic are used.
  postgres-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qradmin
          POSTGRES_PASSWORD: qradmin_ci
          POSTGRES_DB: qradmin_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qradmin -d qradmin_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://qradmin:qradmin_ci@localhost:5432/qradmin_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply all migrations to a clean PostgreSQL database
        run: npm run db:migrate

      - name: Verify migration runner is idempotent
        run: npm run db:migrate
