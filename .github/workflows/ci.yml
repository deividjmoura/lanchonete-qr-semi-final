name: CI

on:
  push:
    branches: ['main', 'hardening/**', 'arena/**']
  pull_request:
    branches: ['main']

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # dist/ é commitado porque o Railway serve esse build. src/ alterado sem
      # rebuild = usuário continua com o bug (foi a saga do tema).
      - name: dist/ matches src/
        run: |
          git add -A dist
          if ! git diff --cached --quiet -- dist; then
            echo "dist/ commitado difere do build deste src/. Rode: npm run build && git add dist && git commit"
            git diff --cached --stat -- dist
            exit 1
          fi

      - name: Regression tests
        run: npm run test:regression

      - name: Server and db syntax
        run: |
          node --check server.js
          for f in db/*.js scripts/*.js; do node --check "$f"; done
