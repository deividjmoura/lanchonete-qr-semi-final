name: PostgreSQL integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'hardening/**', 'test/**']

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: qradmin_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qradmin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Credenciais sintéticas do serviço do próprio job; nenhum secret de produção é necessário.
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/qradmin_test
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply migrations to disposable PostgreSQL
        run: npm run db:migrate
      - name: Run real PostgreSQL integration tests
        run: node --test tests/postgres-integration.test.cjs
      - name: Run financial PostgreSQL integration tests
        run: node --test tests/postgres-financial-integration.test.cjs
      - name: Run waiter ownership PostgreSQL integration tests
        run: node --test tests/postgres-waiter-integration.test.cjs
