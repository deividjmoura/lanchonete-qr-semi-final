name: PostgreSQL integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'hardening/**', 'test/**', 'arena/**', 'fix/**']

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: qradmin_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qradmin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Credenciais sintéticas do serviço do próprio job; nenhum secret de produção é necessário.
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/qradmin_test
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply migrations to disposable PostgreSQL
        run: npm run db:migrate
      - name: Run real PostgreSQL integration tests
        run: node --test tests/postgres-integration.test.cjs
      - name: Run financial PostgreSQL integration tests
        run: node --test tests/postgres-financial-integration.test.cjs
      - name: Run waiter ownership PostgreSQL integration tests
        run: node --test tests/postgres-waiter-integration.test.cjs
      - name: Run progressive delivery / offline replay PostgreSQL tests
        run: node --test tests/postgres-entregas-progressivas.test.cjs
      - name: Run QR/session lifecycle PostgreSQL integration tests
        run: node --test tests/postgres-qr-session.test.cjs
      - name: Run financial concurrency PostgreSQL integration tests
        run: node --test tests/postgres-financial-concurrency.test.cjs
      - name: Staff password change PostgreSQL integration tests
        run: node --test tests/postgres-password-change.test.cjs
      # O runner ubuntu-latest migra de imagem (Ubuntu 26 a partir de 19/10/2026)
      # e o cliente PostgreSQL pré-instalado pode mudar ou desaparecer. Fixar a
      # versão do cliente evita que o drill quebre por motivo alheio ao código.
      - name: Ensure PostgreSQL client 16
        run: |
          if ! command -v pg_dump >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends postgresql-client-16 \
              || sudo apt-get install -y --no-install-recommends postgresql-client
          fi
          pg_dump --version
          pg_restore --version
      - name: Backup/restore drill (pg_dump + pg_restore em banco isolado)
        run: |
          set -o pipefail
          # Publica a causa como annotation: o download de log bruto nem sempre
          # é acessível, e sem isto a falha aparece só como "exit code 1".
          if ! node --test tests/postgres-backup-restore.test.cjs 2>&1 | tee /tmp/drill.log; then
            echo "::error title=Backup/restore drill falhou::$(tail -n 40 /tmp/drill.log | tr '\n' '|' | sed 's/%/%25/g')"
            tail -n 60 /tmp/drill.log
            exit 1
          fi
      # O E2E do lote/cobrança pega ReferenceError em handler do PWA, que os
      # testes de texto e o `node --check` em .js não detectam.
      - name: Extract Chromium shared libraries
        run: |
          node -e "const z=require('zlib'),f=require('fs');f.writeFileSync('/tmp/al2023.tar',z.brotliDecompressSync(f.readFileSync('node_modules/@sparticuz/chromium/bin/al2023.tar.br')))"
          mkdir -p /tmp/al2023 && tar -xf /tmp/al2023.tar -C /tmp/al2023
      - name: Waiter PWA batch delivery + billing E2E (real Chromium)
        env:
          LD_LIBRARY_PATH: /tmp/al2023/lib:/tmp/al2023/usr/lib
        run: node tests/e2e/garcom-lote-cobranca.e2e.cjs
