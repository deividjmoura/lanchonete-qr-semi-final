name: PostgreSQL integration

# Branches de trabalho são validadas pelo PR; a main é validada após o merge.
# Evita executar o mesmo trabalho no push da branch e no pull_request.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Cancela apenas execuções antigas deste workflow no mesmo PR/ref.
# PRs independentes e outros workflows nunca compartilham o grupo.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: qradmin_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qradmin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Credenciais sintéticas do serviço do próprio job; nenhum secret de produção é necessário.
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/qradmin_test
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply migrations to disposable PostgreSQL
        run: npm run db:migrate
      - name: Google OAuth PostgreSQL integration tests
        run: node --test tests/postgres-google-oauth.test.cjs tests/postgres-google-oauth-flow.test.cjs
      - name: Run real PostgreSQL integration tests
        run: node --test tests/postgres-integration.test.cjs
      - name: Run financial PostgreSQL integration tests
        run: node --test tests/postgres-financial-integration.test.cjs
      - name: Run dashboard and period reconciliation PostgreSQL tests
        run: node --test tests/postgres-dashboard.test.cjs
      - name: Run waiter ownership PostgreSQL integration tests
        run: node --test tests/postgres-waiter-integration.test.cjs
      - name: Run waiter removal and concurrency PostgreSQL tests
        run: node --test tests/postgres-remocao-garcom.test.cjs
      - name: Run cursor pagination PostgreSQL tests
        run: node --test tests/postgres-paginacao.test.cjs
      - name: Run manager authorization PostgreSQL tests
        run: node --test tests/postgres-gerente-autorizacao.test.cjs
      - name: Run progressive delivery / offline replay PostgreSQL tests
        run: node --test tests/postgres-entregas-progressivas.test.cjs
      - name: Run QR/session lifecycle PostgreSQL integration tests
        run: node --test tests/postgres-qr-session.test.cjs
      # #301: o ciclo real do aviso de nova versão (endpoint público, cache e
      # shell servido do dist/ versionado) precisa de HTTP + build verdadeiro.
      - name: Version endpoint and shell cache integration (#301)
        run: node --test tests/postgres-version-endpoint.test.cjs
      - name: Run financial concurrency PostgreSQL integration tests
        run: node --test tests/postgres-financial-concurrency.test.cjs
      - name: Staff password change PostgreSQL integration tests
        run: node --test tests/postgres-password-change.test.cjs
      - name: Staff session token hash and legacy compatibility
        run: node --test tests/postgres-staff-session-token-hash.test.cjs
      - name: SSE ticket expiry and single-use integration
        run: node --test tests/postgres-sse-tickets.test.cjs
      # Cobre a rota em si (origem, emissão, consumo único e render do stream).
      # Foi essa lacuna que deixou um ReferenceError em POST /api/events/ticket
      # passar como 500 sem nenhuma suíte falhar.
      - name: SSE ticket HTTP endpoint integration
        run: node --test tests/postgres-sse-ticket-http.test.cjs
      - name: Tables panorama and praças PostgreSQL integration tests
        run: node --test tests/postgres-mesas-panorama.test.cjs
      - name: Waiter billing with service fee PostgreSQL integration tests
        run: node --test tests/postgres-garcom-servico.test.cjs

      # #239: a rota e a trilha de auditoria vistas de fora — sucesso, cada
      # motivo de recusa, gates de sessão/CSRF/origem e duas remoções simultâneas.
      - name: Remoção de e-mail Google — rota HTTP e auditoria
        run: node --test tests/postgres-remover-email-google-http.test.cjs

      # #48 fase 2: autoria financeira por identidade. Sem este step o arquivo não
      # é executado por nenhum job e a PR aparece verde sem exercitar o código.
      - name: Payment authorship by identity PostgreSQL tests (#48)
        run: node --test tests/postgres-pagamento-operador-id.test.cjs

      # Cada um destes arquivos existia na árvore sem nenhum job que o
      # executasse — a suíte "verde" não cobria o que eles provam.
      - name: Cardápio authorship PostgreSQL tests (#48)
        run: node --test tests/postgres-autoria-cardapio.test.cjs
      - name: Shared-device authorship PostgreSQL tests (#48)
        run: node --test tests/postgres-autoria-dispositivo-compartilhado.test.cjs
      - name: Individual staff accounts PostgreSQL tests
        run: node --test tests/postgres-contas-individuais.test.cjs
      - name: Health check with database PostgreSQL tests
        run: node --test tests/postgres-healthz-banco.test.cjs
      - name: Praças removal PostgreSQL tests
        run: node --test tests/postgres-pracas-remocao.test.cjs

      # #44: a purga ANONIMIZA. O valor cobrado, a forma de pagamento, a data e
      # a autoria têm de sobreviver — o DELETE anterior destruía a conciliação.
      - name: Purga anonimiza e preserva o financeiro (#44)
        run: node --test tests/postgres-purge-anonimiza.test.cjs

      # #55: o 2FA de admin de ponta a ponta. O caso que mais importa aqui é o
      # da etapa 1: senha correta NÃO pode gerar sessão utilizável, senão o
      # segundo fator vira decoração.
      - name: 2FA de administrador — login em duas etapas (#55)
        run: node --test tests/postgres-totp-login.test.cjs

      - name: Produção parcial por item (cozinha/bar)
        if: ${{ hashFiles('tests/postgres-producao-parcial.test.cjs') != '' }}
        run: node --test tests/postgres-producao-parcial.test.cjs

      # Rate limit das mutações públicas de mesa (PR #196). Sobe o server.js
      # real em cópia isolada e exercita as quatro rotas por HTTP.
      - name: Rate limit das mutações públicas de mesa (check-in, PIX, cancelar, editar)
        if: ${{ hashFiles('tests/postgres-public-table-rate-limit.test.cjs') != '' }}
        run: node --test tests/postgres-public-table-rate-limit.test.cjs
      # O cliente pg_dump precisa ser da MESMA versão maior do servidor.
      # A imagem do runner traz pg_dump 17+, que emite "SET transaction_timeout"
      # no cabeçalho do dump — parâmetro que o PostgreSQL 16 não reconhece, e o
      # restore morre com "unrecognized configuration parameter". Não é defeito
      # do backup: é descasamento de versão cliente/servidor.
      - name: Ensure PostgreSQL client matches server (16)
        run: |
          set -euo pipefail
          atual="$(pg_dump --version 2>/dev/null | grep -oE '[0-9]+' | head -1 || echo 0)"
          echo "pg_dump no PATH: major=${atual}"
          if [ "$atual" != "16" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ca-certificates curl gnupg
            # PGDG garante o cliente 16 mesmo quando a imagem base já mudou.
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
              -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
            . /etc/os-release
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
              | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends postgresql-client-16
            echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          fi
      - name: Verify client/server major versions
        run: |
          pg_dump --version
          pg_restore --version
          pg_dump --version | grep -qE '\b16\.' \
            || { echo "::error::pg_dump deveria ser 16.x para casar com postgres:16"; exit 1; }
      - name: Backup/restore drill (pg_dump + pg_restore em banco isolado)
        run: |
          set -o pipefail
          # Publica a causa como annotation: o download de log bruto nem sempre
          # é acessível, e sem isto a falha aparece só como "exit code 1".
          if ! node --test tests/postgres-backup-restore.test.cjs 2>&1 | tee /tmp/drill.log; then
            echo "::error title=Backup/restore drill falhou::$(tail -n 40 /tmp/drill.log | tr '\n' '|' | sed 's/%/%25/g')"
            tail -n 60 /tmp/drill.log
            exit 1
          fi
      # O E2E do lote/cobrança pega ReferenceError em handler do PWA, que os
      # testes de texto e o `node --check` em .js não detectam.
      - name: Extract Chromium shared libraries
        run: |
          node -e "const z=require('zlib'),f=require('fs');f.writeFileSync('/tmp/al2023.tar',z.brotliDecompressSync(f.readFileSync('node_modules/@sparticuz/chromium/bin/al2023.tar.br')))"
          mkdir -p /tmp/al2023 && tar -xf /tmp/al2023.tar -C /tmp/al2023
      # O E2E visual (PR #141) roda sobre o build de produção, não sobre o source.
      - name: CSV estoque e reversão transacional do cardápio
        run: node --test tests/postgres-cardapio-import-reversao.test.cjs

      - name: Build for E2E
        run: npm run build
      - name: Admin guide remains public and preserves the staff session
        run: node --test tests/postgres-admin-guide.test.cjs
      # Roda todos os E2E: offline, lote/cobrança, abas CSRF, redefinição de senha
      # pelo admin, importação de cardápio por CSV e sistema visual. O runner sobe
      # e encerra o `vite preview` necessário aos testes que usam API simulada
      # (visual e importação), que não tocam no banco. Os demais sobem o próprio
      # server.js no banco do job.
      - name: E2E in real Chromium (offline, batch/billing, CSRF tabs, admin password reset, CSV cardápio, visual system)
        env:
          LD_LIBRARY_PATH: /tmp/al2023/lib:/tmp/al2023/usr/lib
        run: |
          set -o pipefail
          if ! npm run test:e2e 2>&1 | tee /tmp/e2e.log; then
            # Publica o contexto das suítes que falharam, mesmo quando os logs
            # brutos do Actions não estão disponíveis no ambiente de revisão.
            node -e '
              const texto = require("fs").readFileSync("/tmp/e2e.log", "utf8");
              const partes = texto.split(/(?=^▶ )/m).filter((s) => s.includes("✗ FALHOU "));
              const detalhe = (partes.map((s) => s.slice(-4000)).join("\n") || texto.slice(-4000))
                .slice(-12000).replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");
              console.log(`::error title=E2E falhou::${detalhe}`);
            '
            exit 1
          fi
