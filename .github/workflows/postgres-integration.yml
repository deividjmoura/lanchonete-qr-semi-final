name: PostgreSQL integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'hardening/**', 'test/**', 'arena/**', 'fix/**']

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: qradmin_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qradmin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Credenciais sintéticas do serviço do próprio job; nenhum secret de produção é necessário.
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/qradmin_test
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply migrations to disposable PostgreSQL
        run: npm run db:migrate
      - name: Run real PostgreSQL integration tests
        run: node --test tests/postgres-integration.test.cjs
      - name: Run financial PostgreSQL integration tests
        run: node --test tests/postgres-financial-integration.test.cjs
      - name: Run waiter ownership PostgreSQL integration tests
        run: node --test tests/postgres-waiter-integration.test.cjs
      - name: Run progressive delivery / offline replay PostgreSQL tests
        run: node --test tests/postgres-entregas-progressivas.test.cjs
      - name: Run QR/session lifecycle PostgreSQL integration tests
        run: node --test tests/postgres-qr-session.test.cjs
      - name: Run financial concurrency PostgreSQL integration tests
        run: node --test tests/postgres-financial-concurrency.test.cjs
      - name: Staff password change PostgreSQL integration tests
        run: node --test tests/postgres-password-change.test.cjs
      # O cliente pg_dump precisa ser da MESMA versão maior do servidor.
      # A imagem do runner traz pg_dump 17+, que emite "SET transaction_timeout"
      # no cabeçalho do dump — parâmetro que o PostgreSQL 16 não reconhece, e o
      # restore morre com "unrecognized configuration parameter". Não é defeito
      # do backup: é descasamento de versão cliente/servidor.
      - name: Ensure PostgreSQL client matches server (16)
        run: |
          set -euo pipefail
          atual="$(pg_dump --version 2>/dev/null | grep -oE '[0-9]+' | head -1 || echo 0)"
          echo "pg_dump no PATH: major=${atual}"
          if [ "$atual" != "16" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ca-certificates curl gnupg
            # PGDG garante o cliente 16 mesmo quando a imagem base já mudou.
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
              -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
            . /etc/os-release
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
              | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends postgresql-client-16
            echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          fi
      - name: Verify client/server major versions
        run: |
          pg_dump --version
          pg_restore --version
          pg_dump --version | grep -qE '\b16\.' \
            || { echo "::error::pg_dump deveria ser 16.x para casar com postgres:16"; exit 1; }
      - name: Backup/restore drill (pg_dump + pg_restore em banco isolado)
        run: |
          set -o pipefail
          # Publica a causa como annotation: o download de log bruto nem sempre
          # é acessível, e sem isto a falha aparece só como "exit code 1".
          if ! node --test tests/postgres-backup-restore.test.cjs 2>&1 | tee /tmp/drill.log; then
            echo "::error title=Backup/restore drill falhou::$(tail -n 40 /tmp/drill.log | tr '\n' '|' | sed 's/%/%25/g')"
            tail -n 60 /tmp/drill.log
            exit 1
          fi
      # O E2E do lote/cobrança pega ReferenceError em handler do PWA, que os
      # testes de texto e o `node --check` em .js não detectam.
      - name: Extract Chromium shared libraries
        run: |
          node -e "const z=require('zlib'),f=require('fs');f.writeFileSync('/tmp/al2023.tar',z.brotliDecompressSync(f.readFileSync('node_modules/@sparticuz/chromium/bin/al2023.tar.br')))"
          mkdir -p /tmp/al2023 && tar -xf /tmp/al2023.tar -C /tmp/al2023
      # O E2E visual (PR #141) roda sobre o build de produção, não sobre o source.
      - name: Build for E2E
        run: npm run build
      # roda os três E2E: offline, lote/cobrança e sistema visual. O runner sobe e
      # encerra o `vite preview` necessário ao teste visual, que usa API simulada
      # e não toca no banco. Os demais sobem o próprio server.js no banco do job.
      - name: E2E in real Chromium (offline, batch delivery/billing, visual system)
        env:
          LD_LIBRARY_PATH: /tmp/al2023/lib:/tmp/al2023/usr/lib
        run: npm run test:e2e
