    <script>
      /* Tema antes do primeiro paint — sem flash em nenhum dos dois sentidos.
         Valores canônicos: "claro" | "escuro" (aceita legados "light"/"dark").
         Fallback inline cobre CSS antigo em cache; classes p/ CSS legado. */
      (function () {
        var t;
        try { t = localStorage.getItem("qradmin-tema"); } catch (e) {}
        if (t === "dark") t = "escuro";
        if (t === "light") t = "claro";
        if (t !== "claro" && t !== "escuro")
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "escuro" : "claro";
        var root = document.documentElement;
        root.setAttribute("data-theme", t);
        root.classList.toggle("dark", t === "escuro");
        if (t === "escuro") {
          root.style.setProperty("--qr-page", "#14100d");
          root.style.setProperty("--qr-text", "#f7eee3");
          root.style.setProperty("--qr-white", "#221c16");
        } else {
          root.style.setProperty("--qr-page", "#faf6f0");
          root.style.setProperty("--qr-text", "#241c16");
          root.style.setProperty("--qr-white", "#ffffff");
        }
      })();
    </script>
