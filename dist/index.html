    <link rel="icon" type="image/png" href="/logo/favicon.png" />
    <script>
      /* Tema antes do primeiro paint — sem flash em nenhum dos dois sentidos.
         Valores canônicos: "claro" | "escuro" (aceita legados "light"/"dark").
         Fallback inline cobre CSS antigo em cache; classes p/ CSS legado. */
      (function () {
        var t;
        try { t = localStorage.getItem("qradmin-tema"); } catch (e) {}
        if (t === "dark") t = "escuro";
        if (t === "light") t = "claro";
        if (t !== "claro" && t !== "escuro")
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "escuro" : "claro";
        var root = document.documentElement;
        root.setAttribute("data-theme", t);
        root.classList.toggle("dark", t === "escuro");
        if (t === "escuro") {
          root.style.setProperty("--qr-page", "#0b1524");
          root.style.setProperty("--qr-text", "#eaf2fb");
          root.style.setProperty("--qr-white", "#12233a");
        } else {
          root.style.setProperty("--qr-page", "#e9eef3");
          root.style.setProperty("--qr-text", "#0a2540");
          root.style.setProperty("--qr-white", "#f7f9fb");
        }
      })();
    </script>
