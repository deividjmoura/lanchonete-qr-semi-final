<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Captura — pilotos do Território A</title>
    <style>
      /* Página de captura dos protótipos: mostra o piloto em uma largura exata
         (desktop/mobile) dentro de um iframe, com o altimetro ajustado ao
         conteúdo para a captura de página inteira sair sem cortes.
         Uso: captura.html?tela=cozinha&largura=1440&rotulo=Desktop%201440 */
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 20px;
        background: #d9dee8;
        font: 600 12px/1.4 ui-monospace, "SFMono-Regular", monospace;
        color: #2b3245;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 10px;
        max-width: 1440px;
        margin: 0 auto 10px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      header strong { font-size: 13px; letter-spacing: 0.02em; text-transform: none; }
      iframe {
        display: block;
        margin: 0 auto;
        border: 0;
        background: #fff;
        box-shadow: 0 10px 30px -12px rgba(11, 16, 27, 0.55);
      }
    </style>
  </head>
  <body>
    <header>
      <strong id="rotulo">Piloto</strong>
      <span id="medida"></span>
    </header>
    <iframe id="alvo" title="Piloto" scrolling="no"></iframe>
    <script>
      const params = new URLSearchParams(location.search);
      const tela = params.get("tela") || "cozinha";
      const largura = Number(params.get("largura") || 1440);
      const rotulo = params.get("rotulo") || tela;
      const alvo = document.getElementById("alvo");
      document.getElementById("rotulo").textContent = rotulo;
      document.getElementById("medida").textContent = largura + " px de largura";
      alvo.style.width = largura + "px";
      alvo.src = "./" + tela + ".html";
      alvo.addEventListener("load", () => {
        const doc = alvo.contentDocument;
        const altura = Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight);
        alvo.style.height = altura + "px";
        document.getElementById("medida").textContent += " · " + altura + " px de altura";
        alvo.dataset.pronto = "true";
      });
    </script>
  </body>
</html>
