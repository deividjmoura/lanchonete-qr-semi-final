<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="description" content="QRAdmin — Pedidos por QR Code: do celular do cliente até a cozinha, o garçom e o caixa." />
    <title>QRAdmin · Pedidos por QR Code</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/logo/favicon.png" />
    <script>
      /* tema antes do paint — data-theme=dark quando escuro (CSS legado Railway) */
      (function () {
        var t;
        try { t = localStorage.getItem("qradmin-tema"); } catch (e) {}
        if (t === "dark") t = "escuro";
        if (t === "light") t = "claro";
        if (t !== "claro" && t !== "escuro")
          t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "escuro" : "claro";
        // Atributo no DOM: "dark" casa com [data-theme=dark] do CSS em produção
        document.documentElement.setAttribute("data-theme", t === "escuro" ? "dark" : "claro");
        document.documentElement.classList.toggle("dark", t === "escuro");
        if (t === "escuro") {
          document.documentElement.style.setProperty("--qr-page", "#0b1524");
          document.documentElement.style.setProperty("--qr-text", "#eaf2fb");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
