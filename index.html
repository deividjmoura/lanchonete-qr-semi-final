<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e9eef3" />
    <meta name="description" content="QRAdmin — Pedidos por QR Code: do celular do cliente até a cozinha, o garçom e o caixa." />
    <title>QRAdmin · Pedidos por QR Code</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/logo/favicon.png" />
    <script>
      /* Tema antes do primeiro paint (evita flash e superfície branca agressiva). */
      var t;
      try { t = localStorage.getItem("qradmin-tema"); } catch (e) {}
      if (t !== "claro" && t !== "escuro")
        t = window.matchMedia?.("(prefers-color-scheme: dark)").matches ? "escuro" : "claro";
      document.documentElement.dataset.theme = t;
      if (t === "claro") {
        document.documentElement.style.setProperty("--qr-page", "#e9eef3");
        document.documentElement.style.setProperty("--qr-white", "#f7f9fb");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
